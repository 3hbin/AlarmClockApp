name: Android 8 check

on:
  push:
  workflow_dispatch:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build debug APK and lint (minSdk 26)
        run: ./gradlew assembleDebug lintDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  smoke-android8:
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Start Android 8.0 emulator and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86
          profile: pixel
          script: |
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c || true   # emulator đôi khi không xóa được log: không coi là lỗi app
            adb shell monkey -p com.alarmclock.dongho -c android.intent.category.LAUNCHER 1
            sleep 15
            adb shell pidof com.alarmclock.dongho || (echo "App is not running"; exit 1)
            adb logcat -d > logcat.txt || true
            ! grep -qE "FATAL EXCEPTION|AndroidRuntime.*com.alarmclock" logcat.txt || { echo "Crash found on Android 8"; exit 1; }
            echo "App launched on Android 8 without crash"
